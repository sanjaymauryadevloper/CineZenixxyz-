<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineZenix XYZ - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0b0b; color: #e5e5e5; font-family: 'Segoe UI', Roboto, Arial, sans-serif; padding: 14px; }
    .wrap { max-width: 680px; margin: auto; background: #141414; border: 1px solid #2b2b2b; border-radius: 10px; padding: 18px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; padding-bottom: 12px; margin-bottom: 16px; }
    .logo { font-size: 20px; font-weight: 900; color: #fff; }
    .logo span { color: #e50914; }
    .view-site { background: #222; color: #fff; text-decoration: none; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; border: 1px solid #333; }
    h2 { color: #ffcc00; font-size: 18px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #bbbbbb; margin-bottom: 4px; font-weight: 600; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; background: #1e1e1e; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #e50914; }
    
    .preview-box { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .preview-box img { height: 90px; border-radius: 6px; border: 1px solid #444; object-fit: cover; }

    .sec-title { font-size: 15px; font-weight: bold; margin: 16px 0 8px; padding: 6px 10px; border-radius: 5px; }
    .pj-title { background: #2a1215; color: #ff4d4d; border-left: 4px solid #e50914; }
    .dw-title { background: #102030; color: #00b4ff; border-left: 4px solid #0088ff; }

    .btn-row { display: flex; gap: 10px; margin-top: 14px; }
    .btn-save { flex: 1; background: linear-gradient(90deg, #d30812, #ff2a2a); color: #fff; border: none; padding: 13px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: #333; color: #fff; border: none; padding: 13px 18px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; display: none; }

    .movie-list { margin-top: 26px; border-top: 1px solid #2a2a2a; padding-top: 16px; }
    .m-item { display: flex; justify-content: space-between; align-items: center; background: #1b1b1b; border: 1px solid #2c2c2c; padding: 10px; border-radius: 6px; margin-bottom: 8px; gap: 10px; }
    .m-info { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .m-info img { width: 42px; height: 58px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .m-name { font-size: 13.5px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-edit { background: #0088ff; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12.5px; font-weight: bold; cursor: pointer; }
    .btn-del { background: #ff3b30; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12.5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="top-bar">
      <div class="logo">CINE<span>ZENIX</span> ADMIN</div>
      <a href="index.html" target="_blank" class="view-site">🌐 View Website</a>
    </div>

    <h2 id="formHeading">➕ Add New Movie / Video</h2>
    <input type="hidden" id="editId" value="" />

    <div class="form-group">
      <label>Movie / Video Title *</label>
      <input type="text" id="mTitle" placeholder="Example: Pushpa 2 (2026) Hindi Dubbed 4K / 1080p" />
    </div>

    <div class="form-group">
      <label>Badge Tag (Poster के ऊपर दिखने वाला टैग)</label>
      <select id="mBadge">
        <option value="4K / HD">4K / HD</option>
        <option value="4K ULTRA HD">4K ULTRA HD</option>
        <option value="1080p FULL HD">1080p FULL HD</option>
        <option value="NEW">NEW</option>
        <option value="WEB-DL">WEB-DL</option>
      </select>
    </div>

    <div class="form-group">
      <label>Poster Image URL *</label>
      <input type="text" id="mPoster" placeholder="https://..." oninput="updatePreview()" />
      <div class="preview-box" id="posterPreview"></div>
    </div>

    <div class="form-group">
      <label>Language & IMDb Rating</label>
      <input type="text" id="mLang" value="Hindi Dubbed + English | IMDb 8.4/10" />
    </div>

    <div class="form-group">
      <label>Storyline (Optional)</label>
      <textarea id="mStory" rows="2" placeholder="2-3 लाइन में मूवी की जानकारी लिखें..."></textarea>
    </div>

    <div class="form-group">
      <label>Screenshots URLs (Comma से अलग करके 1 से 4 लिंक डालें)</label>
      <input type="text" id="mSS" placeholder="https://img1.jpg, https://img2.jpg, https://img3.jpg, https://img4.jpg" oninput="updatePreview()" />
      <div class="preview-box" id="ssPreview"></div>
    </div>

    <!-- PlayerJet Links -->
    <div class="sec-title pj-title">▶️ WATCH ONLINE (PlayerJet Server Links)</div>
    <div class="form-group"><input type="text" id="pj480" placeholder="PlayerJet 480p Link" /></div>
    <div class="form-group"><input type="text" id="pj720" placeholder="PlayerJet 720p HD Link" /></div>
    <div class="form-group"><input type="text" id="pj1080" placeholder="PlayerJet 1080p Full HD Link" /></div>
    <div class="form-group"><input type="text" id="pj4k" placeholder="🔥 PlayerJet 4K Ultra HD Link" /></div>

    <!-- Diskwala Links -->
    <div class="sec-title dw-title">⬇️ FAST DOWNLOAD (Diskwala Server Links)</div>
    <div class="form-group"><input type="text" id="dw480" placeholder="Diskwala 480p Link" /></div>
    <div class="form-group"><input type="text" id="dw720" placeholder="Diskwala 720p HD Link" /></div>
    <div class="form-group"><input type="text" id="dw1080" placeholder="Diskwala 1080p Full HD Link" /></div>
    <div class="form-group"><input type="text" id="dw4k" placeholder="🔥 Diskwala 4K Ultra HD Link" /></div>

    <div class="btn-row">
      <button class="btn-save" id="saveBtn">🚀 Publish Movie Live</button>
      <button class="btn-cancel" id="cancelEditBtn">Cancel Edit</button>
    </div>

    <!-- Manage Movies -->
    <div class="movie-list">
      <h2>📋 Uploaded Movies (<span id="movieCount">0</span>)</h2>
      <div id="listContainer">Loading...</div>
    </div>
  </div>

  <!-- Firebase Realtime Database SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmAD-rHHzIt53MLX4KvjV_WYVnzLB8pKw",
      authDomain: "cinezenix-movie-app.firebaseapp.com",
      databaseURL: "https://cinezenix-movie-app-default-rtdb.firebaseio.com",
      projectId: "cinezenix-movie-app",
      storageBucket: "cinezenix-movie-app.firebasestorage.app",
      messagingSenderId: "890785699893",
      appId: "1:890785699893:web:93d83594334fabcd09797c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const moviesRef = ref(db, "movies");

    let MOVIES_MAP = {};

    // Live Image Preview
    window.updatePreview = function() {
      const pUrl = document.getElementById("mPoster").value.trim();
      document.getElementById("posterPreview").innerHTML = pUrl ? `<img src="${pUrl}" onerror="this.style.display='none'" />` : "";

      const ssUrls = document.getElementById("mSS").value.split(",").map(s => s.trim()).filter(s => s);
      document.getElementById("ssPreview").innerHTML = ssUrls.map(u => `<img src="${u}" onerror="this.style.display='none'" />`).join("");
    };

    // Load Movies List
    onValue(moviesRef, (snapshot) => {
      MOVIES_MAP = snapshot.val() || {};
      const keys = Object.keys(MOVIES_MAP).sort((a, b) => (MOVIES_MAP[b].createdAt || 0) - (MOVIES_MAP[a].createdAt || 0));
      document.getElementById("movieCount").innerText = keys.length;

      const container = document.getElementById("listContainer");
      if (keys.length === 0) {
        container.innerHTML = `<p style="color:#777; font-size:13.5px;">अभी कोई मूवी नहीं डाली गई है।</p>`;
        return;
      }

      container.innerHTML = keys.map(id => {
        const m = MOVIES_MAP[id];
        return `
          <div class="m-item">
            <div class="m-info">
              <img src="${m.poster}" alt="" />
              <div class="m-name">${m.title}</div>
            </div>
            <div class="m-actions">
              <button class="btn-edit" onclick="editMovie('${id}')">Edit</button>
              <button class="btn-del" onclick="deleteMovie('${id}')">Delete</button>
            </div>
          </div>
        `;
      }).join("");
    });

    // Publish or Update Movie
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const title = document.getElementById("mTitle").value.trim();
      const poster = document.getElementById("mPoster").value.trim();
      if (!title || !poster) return alert("⚠️ कृपया Movie Title और Poster URL जरूर डालें!");

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.innerText = "Saving...";

      const editId = document.getElementById("editId").value;
      const movieData = {
        title,
        badge: document.getElementById("mBadge").value,
        poster,
        language: document.getElementById("mLang").value.trim(),
        story: document.getElementById("mStory").value.trim(),
        screenshots: document.getElementById("mSS").value.split(",").map(s => s.trim()).filter(s => s),
        pj480: document.getElementById("pj480").value.trim(),
        pj720: document.getElementById("pj720").value.trim(),
        pj1080: document.getElementById("pj1080").value.trim(),
        pj4k: document.getElementById("pj4k").value.trim(),
        dw480: document.getElementById("dw480").value.trim(),
        dw720: document.getElementById("dw720").value.trim(),
        dw1080: document.getElementById("dw1080").value.trim(),
        dw4k: document.getElementById("dw4k").value.trim(),
        createdAt: editId ? (MOVIES_MAP[editId].createdAt || Date.now()) : Date.now()
      };

      try {
        if (editId) {
          await update(ref(db, "movies/" + editId), movieData);
          alert("✅ Movie Update हो गई है!");
        } else {
          const newRef = push(moviesRef);
          await set(newRef, movieData);
          alert("🚀 नई Movie Live हो गई है!");
        }
        resetForm();
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 Publish Movie Live";
      }
    });

    // Edit Movie
    window.editMovie = function(id) {
      const m = MOVIES_MAP[id];
      if (!m) return;
      document.getElementById("editId").value = id;
      document.getElementById("formHeading").innerText = "✏️ Edit Movie";
      document.getElementById("saveBtn").innerText = "💾 Update Movie";
      document.getElementById("cancelEditBtn").style.display = "block";

      document.getElementById("mTitle").value = m.title || "";
      document.getElementById("mBadge").value = m.badge || "4K / HD";
      document.getElementById("mPoster").value = m.poster || "";
      document.getElementById("mLang").value = m.language || "";
      document.getElementById("mStory").value = m.story || "";
      document.getElementById("mSS").value = (m.screenshots || []).join(", ");

      document.getElementById("pj480").value = m.pj480 || "";
      document.getElementById("pj720").value = m.pj720 || "";
      document.getElementById("pj1080").value = m.pj1080 || "";
      document.getElementById("pj4k").value = m.pj4k || "";

      document.getElementById("dw480").value = m.dw480 || "";
      document.getElementById("dw720").value = m.dw720 || "";
      document.getElementById("dw1080").value = m.dw1080 || "";
      document.getElementById("dw4k").value = m.dw4k || "";

      updatePreview();
      window.scrollTo(0, 0);
    };

    // Delete Movie
    window.deleteMovie = async function(id) {
      if (confirm("क्या आप वाकई इस मूवी को डिलीट करना चाहते हैं?")) {
        await remove(ref(db, "movies/" + id));
      }
    };

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("formHeading").innerText = "➕ Add New Movie / Video";
      document.getElementById("saveBtn").innerText = "🚀 Publish Movie Live";
      document.getElementById("cancelEditBtn").style.display = "none";

      ["mTitle", "mPoster", "mStory", "mSS", "pj480", "pj720", "pj1080", "pj4k", "dw480", "dw720", "dw1080", "dw4k"].forEach(id => {
        document.getElementById(id).value = "";
      });
      updatePreview();
    }

    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);
  </script>
</body>
</html>
